name: CI Pipeline - Student API

on:
  push:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'migrations/**'
      - '.github/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'requirements.txt'
      - 'Makefile'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Build API
        run: make build

      - name: Run Tests
        run: make test

      - name: Run Linting
        run: make lint

  docker-build-and-push:
    needs: build-and-test
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Image
        run: make docker-build

      - name: Log in to DockerHub
        run: echo "${{ secrets.DOCKER_PASSCODE }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Debug Environment Variables
        run: |
          echo "DOCKER_USERNAME is: '$DOCKER_USERNAME'"
          echo "DOCKER_USER in Makefile will be: '${DOCKER_USERNAME}'"
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

      - name: Push Docker Image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: make docker-push    
