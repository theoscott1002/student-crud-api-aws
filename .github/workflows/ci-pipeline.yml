name: CI Pipeline - Student API

on:
  push:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'migrations/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'requirements.txt'
      - 'Makefile'
  workflow_dispatch:  # Allow manual triggers

jobs:
  build-and-push:
    runs-on: self-hosted  # Use your local self-hosted runner

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Build API
        run: make build

      - name: Run Tests
        run: make test

      - name: Run Linting
        run: make lint
      
      - name: Docker Login
        run: echo $env:DOCKERHUB_TOKEN | docker login -u $env:DOCKERHUB_USERNAME --password-stdin
        shell: pwsh

      - name: Docker Build and Push
        run: |
          docker build -t $env:DOCKERHUB_USERNAME/student-api:latest .
          docker push $env:DOCKERHUB_USERNAME/student-api:latest
        shell: pwsh