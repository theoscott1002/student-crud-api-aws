name: CI Pipeline - Student API

on:
  push:
    paths:
      - "app/**"
      - "tests/**"
      - "migrations/**"
      - ".github/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "requirements.txt"
      - "Makefile"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Build API
        run: make build

      - name: Run Tests
        run: make test

      - name: Run Linting
        run: make lint

  docker-push-and-pull:
    needs: build-and-test
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: make docker-build

      - name: Debug Docker credentials
        shell: powershell
        env:
           DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
           DOCKER_PASSCODE: ${{ secrets.DOCKER_PASSCODE }}
        run: |
           Write-Host "Docker username is '$env:DOCKER_USERNAME'"
           Write-Host "Password length is $($env:DOCKER_PASSCODE.Length)"

      - name: Log in to DockerHub 
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSCODE: ${{ secrets.DOCKER_PASSCODE }}
        run: |
          echo "Logging into DockerHub as $env:DOCKER_USERNAME"
          echo $env:DOCKER_PASSCODE | docker login -u $env:DOCKER_USERNAME --password-stdin

      - name: Push Docker Image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: make docker-push

      - name: Verify Docker Push
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker pull $env:DOCKER_USERNAME/student-crud-api-aws:latest
          docker images
