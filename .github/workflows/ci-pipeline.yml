name: CI Pipeline - Student API

on:
  push:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'migrations/**'
      - '.github/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'requirements.txt'
      - 'Makefile'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Build API
        run: make build

      - name: Run Tests
        run: make test

      - name: Run Linting
        run: make lint

  docker-build-and-push:
    #needs: build-and-test
    runs-on: self-hosted

    steps:
      - name: Test Docker Login
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSCODE: ${{ secrets.DOCKER_PASSCODE }}
        run: |
          docker logout || true
          echo "$DOCKER_PASSCODE" | docker login -u "$DOCKER_USERNAME" --password-stdin
          docker info
        shell: bash
